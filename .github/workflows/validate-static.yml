name: Validate static site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find assets/js -type f -name '*.js' -print0)

      - name: Check JSON content
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            python3 -m json.tool "$file" >/dev/null
          done < <(find data -type f -name '*.json' -print0)

      - name: Validate Design Studio share codes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          allowed_types = {'rect', 'triangle', 'circle', 'arch', 'window', 'door', 'column', 'tree'}
          allowed_backgrounds = {'grid', 'paper', 'blueprint', 'river', 'lawn', 'sunset', 'night'}
          entries = json.loads(Path('data/designs.json').read_text())
          assert isinstance(entries, list), 'data/designs.json must contain a JSON array'

          for index, entry in enumerate(entries, 1):
              code = str(entry.get('design_code', '')).strip()
              if not code:
                  raise AssertionError(f'Community design #{index} is missing design_code')
              padded = code.replace('-', '+').replace('_', '/') + '=' * ((4 - len(code) % 4) % 4)
              try:
                  design = json.loads(base64.b64decode(padded).decode('utf-8'))
              except Exception as exc:
                  raise AssertionError(f'Community design #{index} has an invalid design code: {exc}') from exc
              if design.get('background', 'grid') not in allowed_backgrounds:
                  raise AssertionError(f'Community design #{index} uses an unsupported background')
              shapes = design.get('shapes', [])
              if not isinstance(shapes, list) or len(shapes) > 60:
                  raise AssertionError(f'Community design #{index} has an invalid shapes list')
              for shape_index, shape in enumerate(shapes, 1):
                  if shape.get('type') not in allowed_types:
                      raise AssertionError(f'Community design #{index}, shape #{shape_index} uses an unsupported type')
                  for key in ('x', 'y', 'w', 'h'):
                      if not isinstance(shape.get(key), (int, float)):
                          raise AssertionError(f'Community design #{index}, shape #{shape_index} has invalid {key}')
          print(f'Validated {len(entries)} community design codes.')
          PY

      - name: Validate live community config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          cfg = json.loads(Path('data/community-backend.json').read_text())
          assert cfg.get('provider') == 'supabase', 'Community backend provider must be supabase'
          assert cfg.get('mode') in {'auto', 'moderated'}, 'Community backend mode must be auto or moderated'
          assert isinstance(cfg.get('enabled'), bool), 'Community backend enabled must be boolean'
          assert isinstance(cfg.get('allow_likes'), bool), 'allow_likes must be boolean'
          assert isinstance(cfg.get('allow_reports'), bool), 'allow_reports must be boolean'
          limit = int(cfg.get('feed_limit', 0))
          assert 12 <= limit <= 100, 'feed_limit must be between 12 and 100'
          url = str(cfg.get('supabase_url', '')).strip()
          key = str(cfg.get('supabase_publishable_key', '')).strip()
          lowered = key.lower()
          assert 'service_role' not in lowered, 'Never expose a Supabase service_role credential in public config'
          assert not lowered.startswith('sb_secret_'), 'Never expose a Supabase secret key in public config'
          if cfg['enabled']:
              assert re.fullmatch(r'https://[a-z0-9-]+\.supabase\.co/?', url, re.I), 'Enabled backend needs a valid Supabase project URL'
              assert len(key) > 20, 'Enabled backend needs a publishable/anon key'
          else:
              assert not key or len(key) > 20, 'Placeholder backend key should be blank or structurally valid'
          print('Live community config validated.')
          PY
          grep -q "enable row level security" docs/design-studio-supabase.sql
          grep -q "apply_community_publish_mode" docs/design-studio-supabase.sql
          grep -q "revoke update on public.community_designs" docs/design-studio-supabase.sql
          grep -q "Anonymous Sign-Ins" docs/design-studio-supabase.sql

      - name: Check Pages CMS YAML
        run: ruby -e "require 'yaml'; YAML.load_file('.pages.yml'); puts 'Pages CMS YAML parsed successfully.'"

      - name: Check Design Studio loader
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/js/designer-v2.js
          test -f assets/js/designer-fun.js
          test -f assets/js/designer-onboarding.js
          test -f assets/js/designer-views.js
          test -f assets/js/designer-playplus.js
          test -f assets/js/designer-presentationplus.js
          test -f assets/js/designer-sketchbook.js
          test -f assets/js/designer-community-bootstrap.js
          test -f assets/js/designer-community.js
          test -f assets/css/designer-fun.css
          test -f assets/css/designer-onboarding.css
          test -f assets/css/designer-views.css
          test -f assets/css/designer-playplus.css
          test -f assets/css/designer-presentationplus.css
          test -f assets/css/designer-sketchbook.css
          test -f assets/css/designer-community.css
          grep -q "designer-v2.js" assets/js/designer.js
          grep -q "designer-fun.js" assets/js/designer.js
          grep -q "designer-onboarding.js" assets/js/designer.js
          grep -q "designer-views.js" assets/js/designer.js
          grep -q "designer-playplus.js" assets/js/designer.js
          grep -q "designer-presentationplus.js" assets/js/designer.js
          grep -q "designer-sketchbook.js" assets/js/designer.js
          grep -q "designer-presentationplus.css" assets/js/designer.js
          grep -q "designer-sketchbook.css" assets/js/designer.js
          grep -q "designer-community-bootstrap.js" assets/js/designer.js
          grep -q "designer-community.js" assets/js/designer-community-bootstrap.js
          grep -q "designer-community.css" assets/js/designer-community-bootstrap.js
          grep -q "sb_secret_" assets/js/designer-community-bootstrap.js
          grep -q "assets/js/designer.js" designer.html

      - name: Check required website files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f designer.html
          test -f assets/js/designer.js
          test -f assets/js/designer-v2.js
          test -f assets/js/designer-fun.js
          test -f assets/js/designer-onboarding.js
          test -f assets/js/designer-views.js
          test -f assets/js/designer-playplus.js
          test -f assets/js/designer-presentationplus.js
          test -f assets/js/designer-sketchbook.js
          test -f assets/js/designer-community-bootstrap.js
          test -f assets/js/designer-community.js
          test -f assets/css/designer.css
          test -f assets/css/designer-fun.css
          test -f assets/css/designer-onboarding.css
          test -f assets/css/designer-views.css
          test -f assets/css/designer-playplus.css
          test -f assets/css/designer-presentationplus.css
          test -f assets/css/designer-sketchbook.css
          test -f assets/css/designer-community.css
          test -f data/designs.json
          test -f data/community-backend.json
          test -f docs/design-studio-supabase.sql
          test -f .pages.yml
