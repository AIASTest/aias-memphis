media:
  input: assets/uploads
  output: assets/uploads
  categories: [image]
  rename: safe

settings:
  hide: true
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "Website content: add {name}"
      update: "Website content: update {name}"
      delete: "Website content: remove {name}"
      rename: "Website content: rename {name}"

content:
  - name: website
    label: Website
    type: group
    items:
      - name: site
        label: Site settings
        type: file
        path: data/site.json
        format: json
        operations:
          delete: false
        fields:
          - { name: chapter_name, label: Full chapter name, type: string, required: true }
          - { name: short_name, label: Header name, type: string, required: true }
          - { name: tagline, label: Tagline, type: string }
          - { name: hero_title, label: Homepage headline, type: string, required: true }
          - { name: hero_text, label: Homepage introduction, type: text, required: true }
          - { name: about_text, label: Chapter description, type: text, required: true }
          - name: contact_email
            label: Public contact email
            type: string
            pattern:
              regex: "^$|^[^@ ]+@[^@ ]+\\.[^@ ]+$"
              message: "Enter a valid email address or leave blank."
          - name: instagram_url
            label: Instagram URL
            type: string
            pattern:
              regex: "^$|^https://.+$"
              message: "Use a full https:// URL or leave blank."
          - name: membership_url
            label: AIAS membership URL
            type: string
            pattern:
              regex: "^$|^https://.+$"
              message: "Use a full https:// URL or leave blank."
          - name: department_url
            label: UofM Architecture URL
            type: string
            pattern:
              regex: "^$|^https://.+$"
              message: "Use a full https:// URL or leave blank."
          - { name: demo_notice, label: Announcement banner, type: string }

      - name: payments
        label: Support & payments
        type: file
        path: data/payments.json
        format: json
        operations:
          delete: false
        fields:
          - { name: page_title, label: Page title, type: string, required: true }
          - { name: page_intro, label: Page introduction, type: text, required: true }
          - { name: firm_section_enabled, label: Show firm payment section, type: boolean }
          - { name: firm_heading, label: Firm payment heading, type: string, required: true }
          - { name: firm_intro, label: Firm payment instructions, type: text, required: true }
          - { name: donation_section_enabled, label: Show donation section, type: boolean }
          - { name: donation_heading, label: Donation heading, type: string, required: true }
          - { name: donation_intro, label: Donation description, type: text, required: true }
          - name: payment_methods
            label: Payment buttons
            type: object
            list: true
            fields:
              - name: provider
                label: Provider
                type: select
                required: true
                options:
                  values: [PayPal, Venmo, Cash App, Zelle, Other]
              - { name: label, label: Button label, type: string, required: true }
              - name: url
                label: Payment account URL
                type: string
                required: true
                pattern:
                  regex: "^https://.+$"
                  message: "Use a full https:// URL."
              - { name: enabled, label: Show this payment button, type: boolean }
          - { name: payment_memo_instructions, label: Firm payment memo instructions, type: text }
          - { name: receipt_note, label: Receipt instructions, type: text }
          - { name: donation_disclaimer, label: Donation / receipt note, type: text }
          - name: contact_email
            label: Payment contact email
            type: string
            pattern:
              regex: "^$|^[^@ ]+@[^@ ]+\\.[^@ ]+$"
              message: "Enter a valid email address or leave blank."

      - name: pages
        label: Custom pages
        type: file
        path: data/pages.json
        format: json
        list: true
        operations:
          delete: false
        fields:
          - { name: title, label: Page title, type: string, required: true }
          - name: slug
            label: Page URL name
            type: string
            required: true
            pattern:
              regex: "^[a-z0-9-]+$"
              message: "Use lowercase letters, numbers, and hyphens only."
          - { name: nav_label, label: Navigation label, type: string }
          - { name: show_in_nav, label: Show in main navigation, type: boolean }
          - { name: summary, label: Page introduction, type: text }
          - name: hero_image
            label: Hero image
            type: image
            options:
              rename: safe
          - { name: hero_image_alt, label: Hero image description, type: string }
          - name: body
            label: Page content
            type: rich-text
            options:
              format: markdown
              switcher: true
              rename: safe

      - name: members
        label: Chapter members
        type: file
        path: data/leadership.json
        format: json
        list: true
        operations:
          delete: false
        fields:
          - name: slug
            label: Member URL name
            type: string
            required: true
            pattern:
              regex: "^[a-z0-9-]+$"
              message: "Use lowercase letters, numbers, and hyphens only."
          - { name: name, label: Name, type: string, required: true }
          - { name: role, label: Chapter role / contribution, type: string, required: true }
          - { name: program, label: Program / year, type: string }
          - name: photo
            label: Profile photo
            type: image
            options:
              rename: safe
          - { name: photo_alt, label: Photo description, type: string }
          - { name: bio, label: Short introduction / blurb, type: text }
          - name: description
            label: Full profile description
            type: rich-text
            options:
              format: markdown
              switcher: true
              rename: safe
          - { name: interests, label: Design / professional interests, type: string }
          - name: email
            label: Public email
            type: string
            pattern:
              regex: "^$|^[^@ ]+@[^@ ]+\\.[^@ ]+$"
              message: "Enter a valid email address or leave blank."
          - { name: public_profile, label: Show public member profile, type: boolean }

  - name: chapter_content
    label: Chapter content
    type: group
    items:
      - name: events
        label: Events
        type: file
        path: data/events.json
        format: json
        list: true
        operations:
          delete: false
        fields:
          - { name: title, label: Event name, type: string, required: true }
          - name: slug
            label: Event URL name
            type: string
            required: true
            pattern:
              regex: "^[a-z0-9-]+$"
              message: "Use lowercase letters, numbers, and hyphens only."
          - { name: date, label: Event date, type: date, required: true }
          - { name: time, label: Time, type: string }
          - { name: location, label: Location, type: string }
          - { name: summary, label: Short event summary, type: text, required: true }
          - name: image
            label: Event image
            type: image
            options:
              rename: safe
          - { name: image_alt, label: Event image description, type: string }
          - name: details
            label: Full event details
            type: rich-text
            required: true
            options:
              format: markdown
              switcher: true
              rename: safe
          - { name: registration_enabled, label: Show RSVP button, type: boolean }
          - name: registration_url
            label: Registration URL
            type: string
            pattern:
              regex: "^$|^https://.+$"
              message: "Use a full https:// URL or leave blank."
          - { name: featured, label: Feature on homepage, type: boolean }

      - name: projects
        label: Student projects
        type: file
        path: data/projects.json
        format: json
        list: true
        operations:
          delete: false
        fields:
          - { name: title, label: Project title, type: string, required: true }
          - name: slug
            label: Project URL name
            type: string
            required: true
            pattern:
              regex: "^[a-z0-9-]+$"
              message: "Use lowercase letters, numbers, and hyphens only."
          - { name: student, label: Student name, type: string, required: true }
          - name: member_slug
            label: Member profile URL name
            type: string
            pattern:
              regex: "^$|^[a-z0-9-]+$"
              message: "Use the member's URL name or leave blank."
          - { name: studio, label: Studio / course, type: string }
          - { name: semester, label: Semester, type: string }
          - { name: year, label: Project year, type: string }
          - { name: project_type, label: Project type, type: string }
          - { name: summary, label: Short project summary, type: text, required: true }
          - name: cover_image
            label: Cover image
            type: image
            required: true
            options:
              rename: safe
          - { name: cover_image_alt, label: Cover image description, type: string }
          - name: gallery
            label: Project gallery
            type: object
            list: true
            fields:
              - name: image
                label: Image
                type: image
                required: true
                options:
                  rename: safe
              - { name: alt, label: Image description, type: string, required: true }
              - { name: caption, label: Caption, type: string }
          - name: body
            label: Full project description
            type: rich-text
            required: true
            options:
              format: markdown
              switcher: true
              rename: safe
          - name: external_url
            label: External project link
            type: string
            pattern:
              regex: "^$|^https://.+$"
              message: "Use a full https:// URL or leave blank."
          - { name: featured, label: Feature on homepage, type: boolean }

      - name: jobs
        label: Jobs & internships
        type: file
        path: data/jobs.json
        format: json
        list: true
        operations:
          delete: false
        fields:
          - { name: title, label: Position title, type: string, required: true }
          - { name: company, label: Organization / firm, type: string, required: true }
          - { name: location, label: Location, type: string }
          - name: type
            label: Opportunity type
            type: select
            required: true
            options:
              values: [Internship, Part-time, Full-time, Fellowship, Competition, Other]
          - { name: posted, label: Posted date, type: date }
          - { name: deadline, label: Application deadline, type: date }
          - { name: summary, label: Description, type: text, required: true }
          - name: apply_url
            label: Application URL
            type: string
            pattern:
              regex: "^$|^https://.+$"
              message: "Use a full https:// URL or leave blank."
          - { name: active, label: Show on website, type: boolean }
