media:
  input: assets/uploads
  output: assets/uploads
  categories: [image]
  rename: safe

settings:
  hide: true
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "Website content: add {name}"
      update: "Website content: update {name}"
      delete: "Website content: remove {name}"
      rename: "Website content: rename {name}"

content:
  - name: website
    label: Website
    type: group
    items:
      - name: site
        label: Site settings
        type: file
        path: data/site.json
        format: json
        operations:
          delete: false
        fields:
          - name: chapter_name
            label: Full chapter name
            type: string
            required: true
            description: "Used in the footer and chapter identification."
            options:
              maxlength: 100
          - name: short_name
            label: Header name
            type: string
            required: true
            description: "Short chapter name shown in the site header."
            options:
              maxlength: 50
          - name: tagline
            label: Tagline
            type: string
            description: "Short supporting line used in the footer."
            options:
              maxlength: 140
          - name: hero_title
            label: Homepage headline
            type: string
            required: true
            description: "Main headline at the top of the homepage."
            options:
              maxlength: 120
          - name: hero_text
            label: Homepage introduction
            type: text
            required: true
            options:
              maxlength: 500
          - name: about_text
            label: Chapter description
            type: text
            required: true
            description: "Main chapter description on the About page."
            options:
              maxlength: 1200
          - name: contact_email
            label: Public contact email
            type: string
            description: "Public chapter email shown on the site. Leave blank if the chapter does not want to publish one."
            pattern:
              regex: "^$|^[^@ ]+@[^@ ]+\\.[^@ ]+$"
              message: "Enter a valid email address or leave this field blank."
          - name: instagram_url
            label: Instagram URL
            type: string
            description: "Full https:// link to the chapter Instagram account."
            pattern:
              regex: "^$|^https://.+$"
              message: "Use a full https:// URL or leave this field blank."
          - name: membership_url
            label: AIAS membership URL
            type: string
            description: "Destination for the Join AIAS button."
            pattern:
              regex: "^$|^https://.+$"
              message: "Use a full https:// URL or leave this field blank."
          - name: department_url
            label: UofM Architecture URL
            type: string
            description: "Link to the University of Memphis Architecture department."
            pattern:
              regex: "^$|^https://.+$"
              message: "Use a full https:// URL or leave this field blank."
          - name: demo_notice
            label: Announcement banner
            type: string
            description: "Optional message shown above the navigation. Clear it completely to hide the banner."
            options:
              maxlength: 160

      - name: pages
        label: Custom pages
        type: file
        path: data/pages.json
        format: json
        list: true
        operations:
          delete: false
        fields:
          - name: title
            label: Page title
            type: string
            required: true
            options:
              maxlength: 100
          - name: slug
            label: Page URL name
            type: string
            required: true
            description: "Lowercase URL name such as resources, scholarships, or competitions. Do not change a slug casually after sharing the page link."
            pattern:
              regex: "^[a-z0-9-]+$"
              message: "Use lowercase letters, numbers, and hyphens only."
            options:
              minlength: 2
              maxlength: 60
          - name: nav_label
            label: Navigation label
            type: string
            description: "Optional shorter label for the main navigation."
            options:
              maxlength: 30
          - name: show_in_nav
            label: Show in main navigation
            type: boolean
            description: "Turn this off for pages that should only be reached through a direct link."
          - name: summary
            label: Page introduction
            type: text
            options:
              maxlength: 350
          - name: hero_image
            label: Hero image
            type: image
            description: "Optional image displayed near the top of the page."
            options:
              rename: safe
          - name: hero_image_alt
            label: Hero image description
            type: string
            description: "Briefly describe meaningful image content for screen-reader users."
            options:
              maxlength: 180
          - name: body
            label: Page content
            type: rich-text
            options:
              format: markdown
              switcher: true
              rename: safe

      - name: leadership
        label: Leadership
        type: file
        path: data/leadership.json
        format: json
        list: true
        operations:
          delete: false
        fields:
          - name: name
            label: Name
            type: string
            required: true
            options:
              maxlength: 80
          - name: role
            label: Position
            type: string
            required: true
            description: "Example: President, Vice President, Faculty Advisor."
            options:
              maxlength: 80
          - name: email
            label: Public email
            type: string
            description: "Leave blank if this address should not be published."
            pattern:
              regex: "^$|^[^@ ]+@[^@ ]+\\.[^@ ]+$"
              message: "Enter a valid email address or leave this field blank."

  - name: chapter_content
    label: Chapter content
    type: group
    items:
      - name: events
        label: Events
        type: file
        path: data/events.json
        format: json
        list: true
        operations:
          delete: false
        fields:
          - name: title
            label: Event name
            type: string
            required: true
            options:
              maxlength: 100
          - name: slug
            label: Event URL name
            type: string
            required: true
            description: "Permanent lowercase identifier used in the event detail link, such as portfolio-night. Avoid changing this after the event link has been shared."
            pattern:
              regex: "^[a-z0-9-]+$"
              message: "Use lowercase letters, numbers, and hyphens only."
            options:
              minlength: 2
              maxlength: 80
          - name: date
            label: Event date
            type: date
            required: true
          - name: time
            label: Time
            type: string
            description: "Example: 6:00 PM or 1:00–3:00 PM."
            options:
              maxlength: 40
          - name: location
            label: Location
            type: string
            description: "Building, room, firm, or general meeting location."
            options:
              maxlength: 120
          - name: summary
            label: Short event summary
            type: text
            required: true
            description: "Brief description shown on event cards and beneath the event title."
            options:
              maxlength: 500
          - name: image
            label: Event image
            type: image
            description: "Optional event image or graphic. Landscape images work best."
            options:
              rename: safe
          - name: image_alt
            label: Event image description
            type: string
            description: "Describe meaningful image content for screen-reader users. If blank, the site uses the event name as a fallback."
            options:
              maxlength: 180
          - name: details
            label: Full event details
            type: rich-text
            required: true
            description: "Expanded event information shown after a visitor opens the event. Use headings, paragraphs, and lists for agenda, what to bring, transportation, speakers, or other useful details."
            options:
              format: markdown
              switcher: true
              rename: safe
          - name: registration_enabled
            label: Show RSVP button
            type: boolean
            description: "Turn this on only when the event should display a Register / RSVP button. If it is off, the RSVP button stays hidden even if a URL is saved below."
          - name: registration_url
            label: Registration URL
            type: string
            description: "Full https:// registration or RSVP link used when Show RSVP button is enabled."
            pattern:
              regex: "^$|^https://.+$"
              message: "Use a full https:// URL or leave this field blank."
          - name: featured
            label: Feature on homepage
            type: boolean
            description: "Featured upcoming events are prioritized on the homepage."

      - name: projects
        label: Student projects
        type: file
        path: data/projects.json
        format: json
        list: true
        operations:
          delete: false
        fields:
          - name: title
            label: Project title
            type: string
            required: true
            description: "The public title shown on project cards and the project detail page."
            options:
              maxlength: 100
          - name: slug
            label: Project URL name
            type: string
            required: true
            description: "Permanent lowercase identifier used in the project link, such as river-threshold. Avoid changing this after the project has been shared."
            pattern:
              regex: "^[a-z0-9-]+$"
              message: "Use lowercase letters, numbers, and hyphens only."
            options:
              minlength: 2
              maxlength: 70
          - name: student
            label: Student name
            type: string
            required: true
            options:
              maxlength: 80
          - name: studio
            label: Studio / course
            type: string
            description: "Example: Third-Year Design Studio."
            options:
              maxlength: 100
          - name: semester
            label: Semester
            type: string
            description: "Example: Fall 2026."
            options:
              maxlength: 40
          - name: year
            label: Project year
            type: string
            description: "Academic or project year, such as 2026."
            options:
              maxlength: 20
          - name: project_type
            label: Project type
            type: string
            description: "Optional category such as Civic / Waterfront, Housing, Adaptive Reuse, or Fabrication."
            options:
              maxlength: 100
          - name: summary
            label: Short project summary
            type: text
            required: true
            description: "Short introduction used on project cards and beneath the project title."
            options:
              maxlength: 500
          - name: cover_image
            label: Cover image
            type: image
            required: true
            description: "Primary image used on project cards and social previews. Landscape images work best."
            options:
              rename: safe
          - name: cover_image_alt
            label: Cover image description
            type: string
            description: "Describe the cover image for visitors using screen readers."
            options:
              maxlength: 180
          - name: gallery
            label: Project gallery
            type: object
            required: true
            list:
              min: 1
              max: 20
              collapsible:
                collapsed: true
                summary: "Image {index}: {caption}"
            description: "Add drawings, renderings, photographs, diagrams, model photos, and process work in the order they should appear."
            fields:
              - name: image
                label: Image
                type: image
                required: true
                options:
                  rename: safe
              - name: alt
                label: Image description
                type: string
                required: true
                description: "Briefly describe what is visible in the image."
                options:
                  maxlength: 220
              - name: caption
                label: Caption
                type: string
                description: "Optional visible caption explaining the image or drawing."
                options:
                  maxlength: 240
          - name: body
            label: Full project description
            type: rich-text
            required: true
            description: "Long-form project narrative. Use headings, paragraphs, lists, and emphasis to explain the project, process, design decisions, and outcomes."
            options:
              format: markdown
              switcher: true
              rename: safe
          - name: external_url
            label: External project link
            type: string
            description: "Optional full https:// link to the student's portfolio, publication, video, or other project page."
            pattern:
              regex: "^$|^https://.+$"
              message: "Use a full https:// URL or leave this field blank."
          - name: featured
            label: Feature on homepage
            type: boolean
            description: "Featured projects are shown first on the homepage."

      - name: jobs
        label: Jobs & internships
        type: file
        path: data/jobs.json
        format: json
        list: true
        operations:
          delete: false
        fields:
          - name: title
            label: Position title
            type: string
            required: true
            options:
              maxlength: 100
          - name: company
            label: Organization / firm
            type: string
            required: true
            options:
              maxlength: 100
          - name: location
            label: Location
            type: string
            description: "Example: Memphis, TN; Remote; Hybrid."
            options:
              maxlength: 100
          - name: type
            label: Opportunity type
            type: select
            required: true
            options:
              values: [Internship, Part-time, Full-time, Fellowship, Competition, Other]
          - name: posted
            label: Posted date
            type: date
          - name: deadline
            label: Application deadline
            type: date
            description: "If a deadline is provided, the public site automatically stops showing the listing after that date."
          - name: summary
            label: Description
            type: text
            required: true
            options:
              maxlength: 900
          - name: apply_url
            label: Application URL
            type: string
            description: "Full https:// link to the application or original job posting."
            pattern:
              regex: "^$|^https://.+$"
              message: "Use a full https:// URL or leave this field blank."
          - name: active
            label: Show on website
            type: boolean
            description: "Turn this off to hide a listing immediately, even if its deadline has not passed."
